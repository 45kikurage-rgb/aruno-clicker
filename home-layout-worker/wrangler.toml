name = "aruno-home-layout"
main = "src/index.js"
compatibility_date = "2026-09-22"
workers_dev = true

[assets]
directory = "./public"

# Same D1 database as aruno-clicker-config: this Worker only uses its own
# home_layout_* tables and reads admin_settings for the shared admin key.
[[d1_databases]]
binding = "DB"
database_name = "aruno-clicker-config"
database_id = "2a15bb15-cff5-46e5-b8e4-df38846580d1"
migrations_dir = "migrations"
