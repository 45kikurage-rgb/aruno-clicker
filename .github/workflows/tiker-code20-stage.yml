name: Preserve verified Aru-Tiker APK in existing private R2
on:
  push:
    branches: [fix/tiker-auto-skip-failed-links-code20-20261028]
    paths: [requests/tiker-code20-stage.json]
permissions:
  contents: read
  actions: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - id: request
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const request=JSON.parse(fs.readFileSync('requests/tiker-code20-stage.json'));
          const response=await fetch(`https://api.github.com/repos/45kikurage-rgb/aruno-clicker/actions/runs/${request.verifyRun}`,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});
          assert(response.ok);const run=await response.json();
          assert(['success','failure'].includes(run.conclusion));assert.equal(run.head_sha,request.sourceCommit);assert.equal(run.path,'.github/workflows/tiker-code20-verify.yml');
          const jobsResponse=await fetch(`https://api.github.com/repos/45kikurage-rgb/aruno-clicker/actions/runs/${request.verifyRun}/jobs`,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});
          assert(jobsResponse.ok);const jobs=await jobsResponse.json();const steps=jobs.jobs[0].steps;
          for(const name of ['Worker unit and SQLite integration tests','Compile complete Android app and run all normal-edition tests'])assert.equal(steps.find(x=>x.name===name)?.conclusion,'success');
          assert(steps.filter(x=>x.conclusion==='failure').every(x=>x.name==='Sign using the existing stable key and verify installed-app compatibility'));
          // Signing itself already finished; independently verify the signed bytes and all JUnit reports below.

          fs.appendFileSync(process.env.GITHUB_OUTPUT,`run=${request.verifyRun}\n`);
          JS
      - uses: actions/download-artifact@v4
        with:
          name: tiker-code20-result
          run-id: ${{ steps.request.outputs.run }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify immutable candidate and prepare its key
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib,re,xml.etree.ElementTree as ET,os
          request=json.load(open('requests/tiker-code20-stage.json'))
          apk=pathlib.Path('candidate/dist/Aru-Tiker-v0.6.3-code20.apk')
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==request['apkSha256']
          pin='14e1d564276b56dfbc95888ce8108aafbdaf4da938f7d5b1ed0fb593f274ca3f'
          for name in ['signature.txt','previous-signature.txt']:
              digests=re.findall(r'certificate SHA-256 digest: ([0-9a-f]+)',pathlib.Path('candidate/dist/'+name).read_text())
              assert digests and set(digests)=={pin}
          totals={k:0 for k in ['tests','failures','errors','skipped']}
          for p in pathlib.Path('candidate/android-app/app/build/test-results/testAtlasDebugUnitTest').glob('TEST-*.xml'):
              report=ET.parse(p).getroot()
              for k in totals:totals[k]+=int(report.attrib.get(k,0))
          assert totals['tests']>=77 and totals['failures']==totals['errors']==totals['skipped']==0,totals
          facts={'package':'jp.aruno.clicker','versionCode':20,'versionName':'0.6.3','commit':request['sourceCommit'],'sha256':request['apkSha256'],'bytes':apk.stat().st_size,'certificateSha256':pin,'androidTests':totals,'physicalTest':'NOT_RUN','independentVerificationRun':os.environ['GITHUB_RUN_ID']}
          pathlib.Path('candidate/dist/release-facts.json').write_text(json.dumps(facts,indent=2))
          pathlib.Path('candidate/key.txt').write_text('releases/tiker/0.6.3-code20/'+facts['sha256']+'/Aru-Tiker-v0.6.3-code20.apk')
          print(json.dumps(facts))
          PY
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs candidate/dist/Aru-Tiker-v0.6.3-code20.apk > candidate/final-signature.txt
          grep -q '14e1d564276b56dfbc95888ce8108aafbdaf4da938f7d5b1ed0fb593f274ca3f' candidate/final-signature.txt
          test "$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id candidate/dist/Aru-Tiker-v0.6.3-code20.apk)" = jp.aruno.clicker
          test "$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-code candidate/dist/Aru-Tiker-v0.6.3-code20.apk)" = 20
      - name: Stage only the versioned APK, preserve all public aliases
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ACCOUNT_ID" = 02100d2235d6f7d7f893b4217b58b902
          test "$R2_BUCKET_NAME" = aruno-clicker-download
          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          key="$(cat candidate/key.txt)"
          digest="$(sha256sum candidate/dist/Aru-Tiker-v0.6.3-code20.apk | cut -d ' ' -f1)"
          aws s3 cp candidate/dist/Aru-Tiker-v0.6.3-code20.apk "s3://${R2_BUCKET_NAME}/${key}" --endpoint-url "$endpoint" --content-type application/vnd.android.package-archive --cache-control public,max-age=31536000,immutable --metadata "sha256=${digest},filename=Aru-Tiker-v0.6.3-code20.apk" --no-progress --only-show-errors
          aws s3 cp "s3://${R2_BUCKET_NAME}/${key}" candidate/readback.apk --endpoint-url "$endpoint" --no-progress --only-show-errors
          test "$(sha256sum candidate/readback.apk | cut -d ' ' -f1)" = "$digest"
          python3 - <<'PY'
          import json,pathlib,os
          facts=json.load(open('candidate/dist/release-facts.json'))
          proof={'sha256':facts['sha256'],'bytes':facts['bytes'],'sourceCommit':facts['commit'],'privateR2ReadbackVerified':True,'key':pathlib.Path('candidate/key.txt').read_text(),'stageRun':os.environ['GITHUB_RUN_ID'],'published':False}
          pathlib.Path('candidate/private-stage.json').write_text(json.dumps(proof,indent=2))
          print(json.dumps(proof))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tiker-code20-private-stage
          path: |
            candidate/private-stage.json
            candidate/dist/release-facts.json
          retention-days: 30
