name: Apply and build ARUNO CLICKER v0.5.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply verified source update
        run: |
          gzip -dc aruno-v050.patch.gz | git apply
          grep -q 'versionName = "0.5.0"' android-app/app/build.gradle.kts
          grep -q 'ARUNO CLICKER ver.S' android-app/app/src/lumen/res/values/strings.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare stable signing key
        env:
          ARUNO_PRIVATE_KEY_PEM: ${{ secrets.ARUNO_PRIVATE_KEY_PEM }}
          ARUNO_SIGNING_PASSWORD: ${{ secrets.ARUNO_SIGNING_PASSWORD }}
        run: |
          test -n "$ARUNO_PRIVATE_KEY_PEM"
          test -n "$ARUNO_SIGNING_PASSWORD"
          printf '%s' "$ARUNO_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/aruno-private-key.pem"
          openssl pkcs12 -export \
            -inkey "$RUNNER_TEMP/aruno-private-key.pem" \
            -in signing/aruno-release.crt \
            -out "$RUNNER_TEMP/aruno-release.p12" \
            -name aruno-stable \
            -passout "pass:$ARUNO_SIGNING_PASSWORD"

      - name: Test server and both Android apps
        env:
          ARUNO_KEYSTORE_PATH: ${{ runner.temp }}/aruno-release.p12
          ARUNO_SIGNING_PASSWORD: ${{ secrets.ARUNO_SIGNING_PASSWORD }}
        run: |
          node --test cloudflare-worker/test/*.test.js
          cd android-app
          chmod +x gradlew
          ./gradlew --no-daemon \
            testAtlasDebugUnitTest \
            testLumenDebugUnitTest \
            assembleAtlasRelease \
            assembleLumenRelease

      - name: Verify and store the two APKs
        run: |
          mkdir -p ci dist
          cp android-app/app/build/outputs/apk/atlas/release/app-atlas-release.apk \
            ci/ARUNO_CLICKER_v0.5.0.apk
          cp android-app/app/build/outputs/apk/lumen/release/app-lumen-release.apk \
            'ci/ARUNO_CLICKER_ver.S_v0.5.0.apk'
          test "$(apkanalyzer manifest application-id ci/ARUNO_CLICKER_v0.5.0.apk)" = "jp.aruno.clicker"
          test "$(apkanalyzer manifest application-id 'ci/ARUNO_CLICKER_ver.S_v0.5.0.apk')" = "jp.aruno.x7c41"
          cp ci/ARUNO_CLICKER_v0.5.0.apk dist/
          cp 'ci/ARUNO_CLICKER_ver.S_v0.5.0.apk' dist/
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Commit verified source and APKs
        run: |
          rm .github/workflows/bootstrap-v050.yml aruno-v050.patch.gz
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add ARUNO CLICKER v0.5.0 dual-install builds"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: aruno-v050-verified
          path: dist/
