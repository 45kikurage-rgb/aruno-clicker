name: Deploy ARUNO home layout Worker


on:
  workflow_dispatch:


permissions:
  contents: read


concurrency:
  group: aruno-home-layout-production
  cancel-in-progress: false


jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: home-layout-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}


    steps:
      - uses: actions/checkout@v4


      - uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Validate Cloudflare credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"


      - name: Install dependencies
        run: npm install --no-package-lock


      - name: Test Worker
        run: npm test


      - name: Deploy home layout Worker
        run: npx wrangler deploy --config wrangler.toml


      - name: Verify production endpoints
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = "https://aruno-home-layout.45kikurage.workers.dev";
          const health = await fetch(base + "/healthz");
          if (!health.ok) throw new Error("healthz failed: " + health.status);
          const layoutRes = await fetch(base + "/v1/home-layout");
          if (!layoutRes.ok) throw new Error("layout fetch failed: " + layoutRes.status);
          const layout = await layoutRes.json();
          if (!Array.isArray(layout.slots) || layout.slots.length !== 16) {
            throw new Error("layout does not contain 16 slots");
          }
          console.log("home-layout OK, revision", layout.revision);
          NODE
