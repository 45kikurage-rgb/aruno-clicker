name: Deploy ARUNOMATIC download page

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "download-worker/src/index.js"
      - "download-worker/test/**"
      - ".github/workflows/deploy-arunomatic-download.yml"

permissions:
  contents: read

concurrency:
  group: arunomatic-download-production-test9-final
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EXPECTED_STABLE_SHA256: a5a90b1d59bb1e4217c19e492e66d1e43e0d966d38101275b31469e3ae950763
      EXPECTED_TEST_SHA256: 05494fa8a82382927277db147004156c7dbdb494528a9c6f897afbbc8a0c672f
      EXPECTED_AIR_TEST_SHA256: 34e6a3ecfa711f264a68d4112d42f138d05e0ed7652270e067b8fdb65329a2f4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test download Worker
        working-directory: download-worker
        run: npm test

      - name: Deploy existing download Worker
        working-directory: download-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.40.0 deploy

      - name: Verify fixed page and both APKs
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location               https://download.aruno-id.com/arunomatic?verify=test9 > /tmp/arunomatic-page.html &&               curl --fail --silent --show-error --location               --output /tmp/arunomatic-stable.apk               --dump-header /tmp/arunomatic-stable.headers               https://download.aruno-id.com/apk/arunomatic.apk &&               curl --fail --silent --show-error --location               --output /tmp/arunomatic-test.apk               --dump-header /tmp/arunomatic-test.headers               https://download.aruno-id.com/apk/arunomatic-v016-test.apk?verify=test9; then
              break
            fi
            sleep 5
          done
          grep -q 'v0.1.5 安定版' /tmp/arunomatic-page.html
          grep -q 'v0.1.6-handoff-test9-final' /tmp/arunomatic-page.html
          grep -q '/apk/arunomatic.apk' /tmp/arunomatic-page.html
          grep -q '/apk/arunomatic-v016-test.apk' /tmp/arunomatic-page.html
          grep -q 'Airウォレット残高取得 試験版' /tmp/arunomatic-page.html
          grep -q '/apk/arunomatic-air-balance-test1.apk' /tmp/arunomatic-page.html
          curl --fail --silent --show-error --location \
            --output /tmp/arunomatic-air-test.apk \
            --dump-header /tmp/arunomatic-air-test.headers \
            https://download.aruno-id.com/apk/arunomatic-air-balance-test1.apk?verify=airtest1
          grep -qi '^content-type: application/vnd.android.package-archive' /tmp/arunomatic-stable.headers
          grep -qi '^content-type: application/vnd.android.package-archive' /tmp/arunomatic-test.headers
          grep -qi '^content-type: application/vnd.android.package-archive' /tmp/arunomatic-air-test.headers
          STABLE_ACTUAL="$(sha256sum /tmp/arunomatic-stable.apk | cut -d ' ' -f 1)"
          TEST_ACTUAL="$(sha256sum /tmp/arunomatic-test.apk | cut -d ' ' -f 1)"
          AIR_ACTUAL="$(sha256sum /tmp/arunomatic-air-test.apk | cut -d ' ' -f 1)"
          echo "stable sha256=$STABLE_ACTUAL"
          echo "test sha256=$TEST_ACTUAL"
          echo "air sha256=$AIR_ACTUAL"
          test "$STABLE_ACTUAL" = "$EXPECTED_STABLE_SHA256"
          test "$TEST_ACTUAL" = "$EXPECTED_TEST_SHA256"
          test "$AIR_ACTUAL" = "$EXPECTED_AIR_TEST_SHA256"
