name: Deploy ARUNOMATIC download page

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "download-worker/src/index.js"
      - "download-worker/test/**"
      - ".github/workflows/deploy-arunomatic-download.yml"

permissions:
  contents: read

concurrency:
  group: arunomatic-download-production-pageflag1000
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EXPECTED_STABLE_SHA256: a5a90b1d59bb1e4217c19e492e66d1e43e0d966d38101275b31469e3ae950763
      EXPECTED_TEST_SHA256: 2810554c82cac53332c402477ee38a9ad516425a14b56507bbf279611eff8821
      EXPECTED_AIR_TEST_SHA256: 4faa2c43050b50d5242b2252df12d17d672a6a4d609b188270d10e0afb491d6f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test download Worker
        working-directory: download-worker
        run: npm test

      - name: Publish ARUNOMATIC AIR balance trial code 21 APK to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$R2_BUCKET_NAME"
          curl --fail --silent --show-error --location             "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-6ee0-8209-bfea-d63f5891397d/raw?se=2026-09-28T20%3A36%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=5df3aad3-7c36-58cb-b984-34bb1f5f94f9&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T00%3A37%3A51Z&ske=2026-09-29T00%3A37%3A51Z&sks=b&skv=2026-02-06&sig=kRrXinSmaqb0CL2cLcCkjvwtBHoH2XEGkJN7ULpPjBI%3D"             -o /tmp/arunomatic-air-balance-trial1-code21.zip
          rm -rf /tmp/arunomatic-air-balance-trial1-code21
          mkdir -p /tmp/arunomatic-air-balance-trial1-code21
          unzip -q /tmp/arunomatic-air-balance-trial1-code21.zip -d /tmp/arunomatic-air-balance-trial1-code21
          APK=/tmp/arunomatic-air-balance-trial1-code21/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test "$(sha256sum "$APK" | cut -d ' ' -f 1)" = "$EXPECTED_AIR_TEST_SHA256"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "$APK"             "s3://${R2_BUCKET_NAME}/releases/arunomatic/air-balance-trial1-code21/ARUNOMATIC_AIR_BALANCE_TRIAL1_CODE21.apk"             --endpoint-url "$ENDPOINT" --region auto             --content-type application/vnd.android.package-archive             --cache-control "public,max-age=31536000,immutable"             --metadata "sha256=${EXPECTED_AIR_TEST_SHA256}" --no-progress --only-show-errors
          aws s3 cp "$APK"             "s3://${R2_BUCKET_NAME}/apk/arunomatic-air-balance-test1.apk"             --endpoint-url "$ENDPOINT" --region auto             --content-type application/vnd.android.package-archive             --cache-control "no-store"             --metadata "sha256=${EXPECTED_AIR_TEST_SHA256}" --no-progress --only-show-errors

      - name: Deploy existing download Worker
        working-directory: download-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.40.0 deploy

      - name: Verify fixed page and both APKs
        run: |
          set -euo pipefail
          verified=0
          for attempt in {1..12}; do
            rm -f /tmp/arunomatic-page.html /tmp/arunomatic-stable.apk /tmp/arunomatic-test.apk /tmp/arunomatic-air-test.apk
            if curl --fail --silent --show-error --location "https://download.aruno-id.com/arunomatic?verify=pageflag1000&attempt=$attempt" > /tmp/arunomatic-page.html && \
               curl --fail --silent --show-error --location --output /tmp/arunomatic-stable.apk --dump-header /tmp/arunomatic-stable.headers "https://download.aruno-id.com/apk/arunomatic.apk?attempt=$attempt" && \
               curl --fail --silent --show-error --location --output /tmp/arunomatic-test.apk --dump-header /tmp/arunomatic-test.headers "https://download.aruno-id.com/apk/arunomatic-v016-test.apk?verify=pageflag1000&attempt=$attempt" && \
               curl --fail --silent --show-error --location --output /tmp/arunomatic-air-test.apk --dump-header /tmp/arunomatic-air-test.headers "https://download.aruno-id.com/apk/arunomatic-air-balance-test1.apk?verify=airtest1&attempt=$attempt"; then
              STABLE_ACTUAL="$(sha256sum /tmp/arunomatic-stable.apk | cut -d ' ' -f 1)"
              TEST_ACTUAL="$(sha256sum /tmp/arunomatic-test.apk | cut -d ' ' -f 1)"
              AIR_ACTUAL="$(sha256sum /tmp/arunomatic-air-test.apk | cut -d ' ' -f 1)"
              if grep -q 'v0.1.5 安定版' /tmp/arunomatic-page.html && \
                 grep -q 'v0.1.6-handoff-test10-pageflag1000 / code 20' /tmp/arunomatic-page.html && \
                 grep -q '/apk/arunomatic-v016-test.apk' /tmp/arunomatic-page.html && \
                 test "$STABLE_ACTUAL" = "$EXPECTED_STABLE_SHA256" && \
                 test "$TEST_ACTUAL" = "$EXPECTED_TEST_SHA256" && \
                 test "$AIR_ACTUAL" = "$EXPECTED_AIR_TEST_SHA256"; then
                verified=1
                break
              fi
            fi
            sleep 5
          done
          test "$verified" = "1"
          grep -q '/apk/arunomatic.apk' /tmp/arunomatic-page.html
          grep -q 'AIRウォレット残高確認 試用版 / code 21' /tmp/arunomatic-page.html
          grep -q '/apk/arunomatic-air-balance-test1.apk' /tmp/arunomatic-page.html
          grep -qi '^content-type: application/vnd.android.package-archive' /tmp/arunomatic-stable.headers
          grep -qi '^content-type: application/vnd.android.package-archive' /tmp/arunomatic-test.headers
          grep -qi '^content-type: application/vnd.android.package-archive' /tmp/arunomatic-air-test.headers
          echo "stable sha256=$STABLE_ACTUAL"
          echo "test sha256=$TEST_ACTUAL"
          echo "air sha256=$AIR_ACTUAL"

