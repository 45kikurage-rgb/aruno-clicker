name: Verify and deploy preserved ARUNOMATIC download channel
on:
  push:
    branches: [main]
    paths: ['download-worker/src/index.js','download-worker/test/**','download-worker/code55/**','.github/workflows/deploy-arunomatic-download.yml']
permissions:
  contents: read
concurrency:
  group: arunomatic-download-production-code34-air-user-number
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate legacy route fixtures and test55 wrapper
        run: |
          npm test --prefix download-worker
          node --test download-worker/code55/code55.test.mjs
      - name: Preserve live source and operating channel; verify exact test55
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node download-worker/code55/deploy.mjs
      - name: Verify actual HTTP APK uses the fixed signer
        run: python3 download-worker/code55/verify-apk-signature.py code55-download-proof/ARUNOMATIC_v0.3.1-safe-task-start-code55.apk code55-download-proof/signature.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code55-canonical-distribution-proof
          path: code55-download-proof/
          if-no-files-found: ignore
