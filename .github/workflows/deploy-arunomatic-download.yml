name: Deploy ARUNOMATIC download page
on:
  push:
    branches: [main]
    paths: ['download-worker/src/index.js','download-worker/test/**','.github/workflows/deploy-arunomatic-download.yml']
permissions:
  contents: read
concurrency:
  group: arunomatic-download-production-code34-air-user-number
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate all existing download routes and code46
        working-directory: download-worker
        run: npm test
      - name: Deploy existing download Worker
        working-directory: download-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.40.0 deploy
      - name: Verify announced page and APK match the existing manifest
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 30 https://download.aruno-id.com/arunomatic/latest.json -o manifest.json
          curl -fsSL --retry 3 --max-time 30 https://download.aruno-id.com/arunomatic -o page.html
          python3 - <<'PY_CHECK'
          import json,pathlib
          m=json.load(open('manifest.json'));p=pathlib.Path('page.html').read_text()
          assert m['version_code'] in (43,45,46)
          assert '最新版 '+m['version_name']+' / code '+str(m['version_code']) in p
          assert 'href="/apk/arunomatic-code'+str(m['version_code'])+'.apk">最新版 code '+str(m['version_code']) in p
          PY_CHECK
