name: Deploy ARUNOMATIC sub-device download

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "download-worker/src/index.js"
      - "download-worker/test/**"
      - "download-worker/assets/arunomatic/**"
      - ".github/workflows/deploy-arunomatic-download.yml"

permissions:
  contents: read

concurrency:
  group: arunomatic-download-production
  cancel-in-progress: false

env:
  APP_VERSION: "0.1.3"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild pinned ARUNOMATIC APK payload
        run: |
          set -euo pipefail
          cat download-worker/assets/arunomatic/part*.b64 | base64 -d > /tmp/ARUNOMATIC_SUB.apk
          EXPECTED="$(tr -d '[:space:]' < download-worker/assets/arunomatic/SHA256.txt)"
          ACTUAL="$(sha256sum /tmp/ARUNOMATIC_SUB.apk | cut -d ' ' -f 1)"
          test "$ACTUAL" = "$EXPECTED"
          test -s /tmp/ARUNOMATIC_SUB.apk
          printf 'APK SHA256: %s\n' "$ACTUAL"

      - name: Test download Worker
        working-directory: download-worker
        run: npm test

      - name: Upload ARUNOMATIC APK to private R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$R2_BUCKET_NAME"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          SHA256="$(sha256sum /tmp/ARUNOMATIC_SUB.apk | cut -d ' ' -f 1)"
          upload_apk() {
            local key="$1"
            local cache="$2"
            aws s3 cp /tmp/ARUNOMATIC_SUB.apk "s3://${R2_BUCKET_NAME}/${key}" \
              --endpoint-url "$ENDPOINT" \
              --region auto \
              --content-type application/vnd.android.package-archive \
              --cache-control "$cache" \
              --metadata "sha256=${SHA256}" \
              --no-progress --only-show-errors
          }
          upload_apk "releases/arunomatic/v${APP_VERSION}/ARUNOMATIC_SUB.apk" "public,max-age=31536000,immutable"
          upload_apk "apk/arunomatic.apk" "public,max-age=60,must-revalidate"

      - name: Deploy existing download Worker
        working-directory: download-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.40.0 deploy

      - name: Verify fixed page and APK
        run: |
          set -euo pipefail
          EXPECTED="$(tr -d '[:space:]' < download-worker/assets/arunomatic/SHA256.txt)"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location \
              https://download.aruno-id.com/arunomatic > /tmp/arunomatic-page.html && \
              curl --fail --silent --show-error --location \
              --output /tmp/arunomatic.apk \
              --dump-header /tmp/arunomatic.headers \
              https://download.aruno-id.com/apk/arunomatic.apk; then
              break
            fi
            sleep 5
          done
          grep -q 'ARUNOMATIC' /tmp/arunomatic-page.html
          grep -q 'サブ端末用' /tmp/arunomatic-page.html
          grep -q '/apk/arunomatic.apk' /tmp/arunomatic-page.html
          grep -qi '^content-type: application/vnd.android.package-archive' /tmp/arunomatic.headers
          test "$(sha256sum /tmp/arunomatic.apk | cut -d ' ' -f 1)" = "$EXPECTED"
