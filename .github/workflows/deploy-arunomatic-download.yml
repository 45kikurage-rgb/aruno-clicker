name: Deploy ARUNOMATIC download page

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "download-worker/src/index.js"
      - "download-worker/test/**"
      - ".github/workflows/deploy-arunomatic-download.yml"

permissions:
  contents: read

concurrency:
  group: arunomatic-download-production-test7-range
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EXPECTED_STABLE_SHA256: a5a90b1d59bb1e4217c19e492e66d1e43e0d966d38101275b31469e3ae950763
      EXPECTED_TEST_SHA256: 7b7d61335b919019c12713c727688ab2944f24963adde407e79de575e97e32e5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test download Worker
        working-directory: download-worker
        run: npm test

      - name: Publish ARUNOMATIC test7 APK to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          TEST_ARTIFACT_ZIP_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-2ee8-81f5-bf5e-5f92580d62c9/raw?se=2026-09-28T09%3A44%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=2894bee8-5079-5fdf-8971-676bc9ba8fbe&skoid=18c14e53-ea0c-429b-8d09-d22d66ca7169&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T05%3A25%3A31Z&ske=2026-09-29T05%3A25%3A31Z&sks=b&skv=2026-02-06&sig=bVd5v2hnR3r%2BujCoBMbA9gksd%2B1aKVlzDF%2BO6DtQBmw%3D"
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$R2_BUCKET_NAME"
          curl --fail --silent --show-error --location "$TEST_ARTIFACT_ZIP_URL" -o /tmp/arunomatic-test7.zip
          rm -rf /tmp/arunomatic-test7
          mkdir -p /tmp/arunomatic-test7
          unzip -q /tmp/arunomatic-test7.zip -d /tmp/arunomatic-test7
          APK="$(find /tmp/arunomatic-test7 -type f -name 'app-debug.apk' -print -quit)"
          test -n "$APK"
          test "$(sha256sum "$APK" | cut -d ' ' -f 1)" = "$EXPECTED_TEST_SHA256"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "$APK"             "s3://${R2_BUCKET_NAME}/releases/arunomatic/v0.1.6-handoff-test7-range/ARUNOMATIC_SUB_v0.1.6-handoff-test7-range.apk"             --endpoint-url "$ENDPOINT" --region auto             --content-type application/vnd.android.package-archive             --cache-control "public,max-age=31536000,immutable"             --metadata "sha256=${EXPECTED_TEST_SHA256}" --no-progress --only-show-errors
          aws s3 cp "$APK"             "s3://${R2_BUCKET_NAME}/apk/arunomatic-v016-test.apk"             --endpoint-url "$ENDPOINT" --region auto             --content-type application/vnd.android.package-archive             --cache-control "public,max-age=60,must-revalidate"             --metadata "sha256=${EXPECTED_TEST_SHA256}" --no-progress --only-show-errors

      - name: Deploy existing download Worker
        working-directory: download-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.40.0 deploy

      - name: Verify fixed page and both APKs
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location               https://download.aruno-id.com/arunomatic > /tmp/arunomatic-page.html &&               curl --fail --silent --show-error --location               --output /tmp/arunomatic-stable.apk               --dump-header /tmp/arunomatic-stable.headers               https://download.aruno-id.com/apk/arunomatic.apk &&               curl --fail --silent --show-error --location               --output /tmp/arunomatic-test.apk               --dump-header /tmp/arunomatic-test.headers               https://download.aruno-id.com/apk/arunomatic-v016-test.apk; then
              break
            fi
            sleep 5
          done
          grep -q 'v0.1.5 安定版' /tmp/arunomatic-page.html
          grep -q 'v0.1.6-handoff-test7-range' /tmp/arunomatic-page.html
          grep -q '/apk/arunomatic.apk' /tmp/arunomatic-page.html
          grep -q '/apk/arunomatic-v016-test.apk' /tmp/arunomatic-page.html
          grep -qi '^content-type: application/vnd.android.package-archive' /tmp/arunomatic-stable.headers
          grep -qi '^content-type: application/vnd.android.package-archive' /tmp/arunomatic-test.headers
          test "$(sha256sum /tmp/arunomatic-stable.apk | cut -d ' ' -f 1)" = "$EXPECTED_STABLE_SHA256"
          test "$(sha256sum /tmp/arunomatic-test.apk | cut -d ' ' -f 1)" = "$EXPECTED_TEST_SHA256"
