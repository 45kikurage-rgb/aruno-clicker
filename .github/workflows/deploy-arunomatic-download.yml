name: Deploy ARUNOMATIC download page

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "download-worker/src/index.js"
      - "download-worker/test/**"
      - ".github/workflows/deploy-arunomatic-download.yml"

permissions:
  contents: read

concurrency:
  group: arunomatic-download-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EXPECTED_STABLE_SHA256: a5a90b1d59bb1e4217c19e492e66d1e43e0d966d38101275b31469e3ae950763
      EXPECTED_TEST_SHA256: adf29e407e7474cdf52c3f2ca481122fb627b8b11ab9b4ca2c48b12f0d4ec832
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test download Worker
        working-directory: download-worker
        run: npm test

      - name: Deploy existing download Worker
        working-directory: download-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.40.0 deploy

      - name: Verify fixed page and both APKs
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location               https://download.aruno-id.com/arunomatic > /tmp/arunomatic-page.html &&               curl --fail --silent --show-error --location               --output /tmp/arunomatic-stable.apk               --dump-header /tmp/arunomatic-stable.headers               https://download.aruno-id.com/apk/arunomatic.apk &&               curl --fail --silent --show-error --location               --output /tmp/arunomatic-test.apk               --dump-header /tmp/arunomatic-test.headers               https://download.aruno-id.com/apk/arunomatic-v016-test.apk; then
              break
            fi
            sleep 5
          done
          grep -q 'v0.1.5 安定版' /tmp/arunomatic-page.html
          grep -q 'v0.1.6 引き継ぎテスト版（ページフラグ判定）' /tmp/arunomatic-page.html
          grep -q '/apk/arunomatic.apk' /tmp/arunomatic-page.html
          grep -q '/apk/arunomatic-v016-test.apk' /tmp/arunomatic-page.html
          grep -qi '^content-type: application/vnd.android.package-archive' /tmp/arunomatic-stable.headers
          grep -qi '^content-type: application/vnd.android.package-archive' /tmp/arunomatic-test.headers
          test "$(sha256sum /tmp/arunomatic-stable.apk | cut -d ' ' -f 1)" = "$EXPECTED_STABLE_SHA256"
          test "$(sha256sum /tmp/arunomatic-test.apk | cut -d ' ' -f 1)" = "$EXPECTED_TEST_SHA256"
