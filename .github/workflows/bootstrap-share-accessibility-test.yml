name: Apply Redmi A3 share accessibility test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply isolated share test implementation
        env:
          PATCH_GZIP_BASE64: ''
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_GZIP_BASE64" | base64 -d | gunzip > /tmp/share-accessibility.patch
          git apply --check /tmp/share-accessibility.patch
          git apply /tmp/share-accessibility.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-app download-worker
          git diff --cached --check
          git commit -m 'Add isolated Redmi A3 accessibility overlay test'
          git push origin HEAD:main
