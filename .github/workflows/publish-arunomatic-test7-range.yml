name: Publish ARUNOMATIC test7 range APK

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-arunomatic-test7-range.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_VERSION: "0.1.6-handoff-test7-range"
  EXPECTED_SHA256: "7b7d61335b919019c12713c727688ab2944f24963adde407e79de575e97e32e5"
  ARTIFACT_ZIP_URL: "https://sdmntprwestus.oaiusercontent.com/files/00000000-5b40-8230-8a7d-dfca0dc6f459/raw?se=2026-09-28T09%3A44%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=9550dce2-583d-53d5-8532-36f6caed07ce&skoid=18c14e53-ea0c-429b-8d09-d22d66ca7169&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T09%3A25%3A42Z&ske=2026-09-29T09%3A25%3A42Z&sks=b&skv=2026-02-06&sig=omw65ByDaB0nKWbY7gyPXxmkFEDu%2FewkjgF3ieCnviA%3D"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified ARUNOMATIC build artifact
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$ARTIFACT_ZIP_URL" -o /tmp/arunomatic.zip
          mkdir -p /tmp/arunomatic
          unzip -q /tmp/arunomatic.zip -d /tmp/arunomatic
          APK="/tmp/arunomatic/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          test "$(sha256sum "$APK" | cut -d ' ' -f 1)" = "$EXPECTED_SHA256"
          cp "$APK" /tmp/ARUNOMATIC_SUB_${APP_VERSION}.apk

      - name: Upload test APK to private R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$R2_BUCKET_NAME"
          APK="/tmp/ARUNOMATIC_SUB_${APP_VERSION}.apk"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          for KEY in             "tests/arunomatic/${APP_VERSION}/ARUNOMATIC_SUB_${APP_VERSION}.apk"             "apk/arunomatic-v016-test.apk"; do
            aws s3 cp "$APK" "s3://${R2_BUCKET_NAME}/${KEY}"               --endpoint-url "$ENDPOINT"               --region auto               --content-type application/vnd.android.package-archive               --cache-control 'public,max-age=60,must-revalidate'               --metadata "sha256=${EXPECTED_SHA256},version=${APP_VERSION}"               --no-progress               --only-show-errors
          done

      - name: Verify current public test route
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location               https://download.aruno-id.com/apk/arunomatic-v016-test.apk               -o /tmp/public.apk; then
              if test "$(sha256sum /tmp/public.apk | cut -d ' ' -f 1)" = "$EXPECTED_SHA256"; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Published APK hash did not converge" >&2
          exit 1
