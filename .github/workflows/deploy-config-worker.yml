name: Deploy ARUNO config Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aruno-clicker-config-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Cloudflare credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Test Worker
        run: npm test

      - name: Deploy existing config Worker
        run: npx wrangler deploy --config wrangler.toml

      - name: Verify production schema
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = "https://aruno-clicker-config.45kikurage.workers.dev";

          async function fetchWithPropagationRetry(path) {
            let lastResponse;
            for (let attempt = 1; attempt <= 10; attempt += 1) {
              lastResponse = await fetch(`${base}${path}`);
              if (lastResponse.ok) return lastResponse;
              await new Promise((resolve) => setTimeout(resolve, 3000));
            }
            return lastResponse;
          }

          const healthResponse = await fetchWithPropagationRetry("/healthz");
          if (!healthResponse.ok) {
            throw new Error(`healthz returned HTTP ${healthResponse.status}`);
          }
          const health = await healthResponse.json();
          if (health.ok !== true || health.schemaVersion !== 2) {
            throw new Error(`unexpected health response: ${JSON.stringify(health)}`);
          }

          const configResponse = await fetchWithPropagationRetry("/v1/config");
          if (!configResponse.ok) {
            throw new Error(`config returned HTTP ${configResponse.status}`);
          }
          const config = await configResponse.json();
          for (const key of ["name1", "url1", "name2", "url2", "shareName", "shareUrl"]) {
            if (typeof config[key] !== "string") {
              throw new Error(`missing config field: ${key}`);
            }
          }
          if (config.schemaVersion !== 2 || !Number.isInteger(config.configVersion)) {
            throw new Error(`unexpected config schema: ${JSON.stringify(config)}`);
          }
          console.log(`Production schema ${config.schemaVersion}, config version ${config.configVersion}`);
          NODE

      - name: Capture Worker error diagnostics
        if: failure()
        run: |
          set -euo pipefail
          npx wrangler tail aruno-clicker-config --format=json > /tmp/aruno-worker-tail.log 2>&1 &
          tail_pid=$!
          trap 'kill "$tail_pid" 2>/dev/null || true' EXIT
          sleep 3
          curl -sS -o /dev/null https://aruno-clicker-config.45kikurage.workers.dev/healthz || true
          sleep 3
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true
          cat /tmp/aruno-worker-tail.log
