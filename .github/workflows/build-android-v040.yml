name: Build ARUNO CLICKER v0.4.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply v0.4.0 source update
        run: |
          base64 -d aruno-clicker-v0.4.0.patch.gz.b64 | gzip -d > /tmp/aruno-clicker-v0.4.0.patch
          git apply /tmp/aruno-clicker-v0.4.0.patch

      - name: Prepare Android source
        run: chmod +x android-app/gradlew

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        working-directory: android-app
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Store verified source and CI APK
        run: |
          mkdir -p ci
          cp android-app/app/build/outputs/apk/debug/app-debug.apk ci/ARUNO_CLICKER_v0.4.0-ci.apk
          find android-app -type d -name build -prune -exec rm -rf {} +
          rm -rf android-app/.gradle
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android-app ci/ARUNO_CLICKER_v0.4.0-ci.apk
          git commit -m "Add Android v0.4.0 verified CI build"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: ARUNO_CLICKER_v0.4.0-ci
          path: ci/ARUNO_CLICKER_v0.4.0-ci.apk
