name: Publish ARUNOMATIC code22 integrated test APK

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-arunomatic-code22-integrated.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      EXPECTED_TEST_SHA256: ff0eb67fdbf3040a62f9c7184ebf9484d0de1547161219ebc7c7841f275264da
      TEST_ARTIFACT_ZIP_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-b3b4-8209-905d-7c824534d8f7/raw?se=2026-09-28T21%3A27%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=6b819635-2f37-50b4-9799-7d43eac9e743&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T20%3A47%3A47Z&ske=2026-09-29T20%3A47%3A47Z&sks=b&skv=2026-02-06&sig=y0kydn7W3ckYaueotCGKQjmbxINraXG8%2BQ35p3onJjQ%3D"
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified integrated code22 APK to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$R2_BUCKET_NAME"
          curl --fail --silent --show-error --location "$TEST_ARTIFACT_ZIP_URL" -o /tmp/arunomatic-code22.zip
          rm -rf /tmp/arunomatic-code22
          mkdir -p /tmp/arunomatic-code22
          unzip -q /tmp/arunomatic-code22.zip -d /tmp/arunomatic-code22
          APK="$(find /tmp/arunomatic-code22 -type f -name 'app-debug.apk' -print -quit)"
          test -n "$APK"
          test "$(sha256sum "$APK" | cut -d ' ' -f 1)" = "$EXPECTED_TEST_SHA256"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "$APK" \
            "s3://${R2_BUCKET_NAME}/releases/arunomatic/v0.1.6-handoff-test12-airbalance/ARUNOMATIC_v0.1.6-handoff-test12-airbalance.apk" \
            --endpoint-url "$ENDPOINT" --region auto \
            --content-type application/vnd.android.package-archive \
            --cache-control "public,max-age=31536000,immutable" \
            --metadata "sha256=${EXPECTED_TEST_SHA256}" --no-progress --only-show-errors
          aws s3 cp "$APK" \
            "s3://${R2_BUCKET_NAME}/apk/arunomatic-v016-test.apk" \
            --endpoint-url "$ENDPOINT" --region auto \
            --content-type application/vnd.android.package-archive \
            --cache-control "no-store" \
            --metadata "sha256=${EXPECTED_TEST_SHA256}" --no-progress --only-show-errors
