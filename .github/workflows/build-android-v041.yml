name: Build ARUNO CLICKER v0.4.1 stable

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply v0.4.1 source update
        run: |
          if grep -q 'versionName = "0.4.0"' android-app/app/build.gradle.kts; then
            printf '%s' '' | base64 --decode | gzip --decompress | git apply
          fi
          grep -q 'versionName = "0.4.1"' android-app/app/build.gradle.kts
          grep -q 'android:icon="@mipmap/ic_launcher"' android-app/app/src/main/AndroidManifest.xml

      - name: Prepare stable signing key
        env:
          ARUNO_PRIVATE_KEY_PEM: ${{ secrets.ARUNO_PRIVATE_KEY_PEM }}
          ARUNO_SIGNING_PASSWORD: ${{ secrets.ARUNO_SIGNING_PASSWORD }}
        run: |
          test -n "$ARUNO_PRIVATE_KEY_PEM"
          test -n "$ARUNO_SIGNING_PASSWORD"
          mkdir -p signing
          printf '%s' "$ARUNO_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/aruno-private-key.pem"
          if [ ! -f signing/aruno-release.crt ]; then
            openssl req -new -x509 \
              -key "$RUNNER_TEMP/aruno-private-key.pem" \
              -out signing/aruno-release.crt \
              -days 10000 \
              -set_serial 1 \
              -subj "/C=JP/ST=Tokyo/L=Tokyo/O=ARUNO/OU=Mobile Apps/CN=ARUNO CLICKER"
          fi
          openssl pkcs12 -export \
            -inkey "$RUNNER_TEMP/aruno-private-key.pem" \
            -in signing/aruno-release.crt \
            -out "$RUNNER_TEMP/aruno-release.p12" \
            -name aruno-stable \
            -passout "pass:$ARUNO_SIGNING_PASSWORD"

      - name: Test and build stable release
        working-directory: android-app
        env:
          ARUNO_KEYSTORE_PATH: ${{ runner.temp }}/aruno-release.p12
          ARUNO_SIGNING_PASSWORD: ${{ secrets.ARUNO_SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Store verified stable APK
        run: |
          mkdir -p ci
          cp android-app/app/build/outputs/apk/release/app-release.apk ci/ARUNO_CLICKER_v0.4.1-stable.apk
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android-app signing/aruno-release.crt ci/ARUNO_CLICKER_v0.4.1-stable.apk
          git commit -m "Add ARUNO CLICKER v0.4.1 stable APK"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: ARUNO_CLICKER_v0.4.1-stable
          path: ci/ARUNO_CLICKER_v0.4.1-stable.apk
