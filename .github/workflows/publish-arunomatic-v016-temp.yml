name: Publish ARUNOMATIC v0.1.6 test temporary

on:
  push:
    branches:
      - update/arunomatic-dual-versions
    paths:
      - ".github/workflows/publish-arunomatic-v016-temp.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA256: 42abcb10357756ba06d44757f63a86716603d32f28d275616ffa8ad3472f7990
      ARTIFACT_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-919c-8206-af34-cbaa43520aba/raw?se=2026-09-28T04%3A59%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=22809b44-0bfd-5fd6-8cfd-a250f4f918e4&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T23%3A19%3A09Z&ske=2026-09-28T23%3A19%3A09Z&sks=b&skv=2026-02-06&sig=jkgFFGb2r7SLI7JQR0oWxZL5nUYUv90TE6cko5jf9l4%3D"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch verified ARUNOMATIC v0.1.6 test build
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$ARTIFACT_URL" -o /tmp/arunomatic-v016.zip
          mkdir -p /tmp/arunomatic-v016
          unzip -q /tmp/arunomatic-v016.zip -d /tmp/arunomatic-v016
          APK="$(find /tmp/arunomatic-v016 -type f -name 'app-debug.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" /tmp/ARUNOMATIC_SUB_v0.1.6_handoff_test.apk
          test "$(sha256sum /tmp/ARUNOMATIC_SUB_v0.1.6_handoff_test.apk | cut -d ' ' -f 1)" = "$EXPECTED_SHA256"

      - name: Test download Worker
        working-directory: download-worker
        run: npm test

      - name: Upload v0.1.6 test to private R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$R2_BUCKET_NAME"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          upload_apk() {
            local key="$1"
            local cache="$2"
            aws s3 cp /tmp/ARUNOMATIC_SUB_v0.1.6_handoff_test.apk "s3://${R2_BUCKET_NAME}/${key}"               --endpoint-url "$ENDPOINT"               --region auto               --content-type application/vnd.android.package-archive               --cache-control "$cache"               --metadata "sha256=${EXPECTED_SHA256}"               --no-progress --only-show-errors
          }
          upload_apk "releases/arunomatic/v0.1.6/ARUNOMATIC_SUB_v0.1.6_handoff_test.apk" "public,max-age=31536000,immutable"
          upload_apk "apk/arunomatic-v016-test.apk" "public,max-age=60,must-revalidate"

      - name: Deploy dual-version download Worker
        working-directory: download-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.40.0 deploy

      - name: Verify both versions
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location https://download.aruno-id.com/arunomatic > /tmp/page.html &&               curl --fail --silent --show-error --location --output /tmp/test.apk https://download.aruno-id.com/apk/arunomatic-v016-test.apk; then
              break
            fi
            sleep 5
          done
          grep -q 'v0.1.5 安定版' /tmp/page.html
          grep -q 'v0.1.6 引き継ぎテスト版' /tmp/page.html
          test "$(sha256sum /tmp/test.apk | cut -d ' ' -f 1)" = "$EXPECTED_SHA256"
