name: Publish ARUNOMATIC test9b final APK

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-arunomatic-test9b-final.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      EXPECTED_TEST_SHA256: 882ab20260cefd62b1e20d3fd70d59443309cb2519ef7a8fb5041ed52707c488
      TEST_ARTIFACT_ZIP_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-7240-8211-a9f3-d392c34b1488/raw?se=2026-09-28T12%3A02%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=5661d7fb-bb96-57b2-8c85-11ce20bf098e&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T00%3A13%3A17Z&ske=2026-09-29T00%3A13%3A17Z&sks=b&skv=2026-02-06&sig=BfsAx3iCXDEHogZaGl1311AKxeca7vvmwFLfbo0cj/c%3D"
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified test9b APK to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$R2_BUCKET_NAME"
          curl --fail --silent --show-error --location "$TEST_ARTIFACT_ZIP_URL" -o /tmp/arunomatic-test9b.zip
          rm -rf /tmp/arunomatic-test9b
          mkdir -p /tmp/arunomatic-test9b
          unzip -q /tmp/arunomatic-test9b.zip -d /tmp/arunomatic-test9b
          APK="$(find /tmp/arunomatic-test9b -type f -name 'app-debug.apk' -print -quit)"
          test -n "$APK"
          test "$(sha256sum "$APK" | cut -d ' ' -f 1)" = "$EXPECTED_TEST_SHA256"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "$APK" \
            "s3://${R2_BUCKET_NAME}/releases/arunomatic/v0.1.6-handoff-test9b-final/ARUNOMATIC_SUB_v0.1.6-handoff-test9b-final.apk" \
            --endpoint-url "$ENDPOINT" --region auto \
            --content-type application/vnd.android.package-archive \
            --cache-control "public,max-age=31536000,immutable" \
            --metadata "sha256=${EXPECTED_TEST_SHA256}" --no-progress --only-show-errors
          aws s3 cp "$APK" \
            "s3://${R2_BUCKET_NAME}/apk/arunomatic-v016-test.apk" \
            --endpoint-url "$ENDPOINT" --region auto \
            --content-type application/vnd.android.package-archive \
            --cache-control "no-store" \
            --metadata "sha256=${EXPECTED_TEST_SHA256}" --no-progress --only-show-errors
