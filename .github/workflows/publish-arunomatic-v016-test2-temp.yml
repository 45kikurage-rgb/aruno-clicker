name: Publish updated ARUNOMATIC v0.1.6 test temporary

on:
  push:
    branches:
      - update/arunomatic-v016-test2
    paths:
      - ".github/workflows/publish-arunomatic-v016-test2-temp.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA256: a858c66078935226d84901243ac6ddec13960d9ddab22888849d789658465828
      ARTIFACT_URL: "https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-7c58-81fb-b7a1-30ffbe88f5a3/raw?se=2026-09-28T06%3A06%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=dcf36601-0a60-5c69-8cc1-3926685e1a71&skoid=18c14e53-ea0c-429b-8d09-d22d66ca7169&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T00%3A15%3A49Z&ske=2026-09-29T00%3A15%3A49Z&sks=b&skv=2026-02-06&sig=B9TOMkFHNZmD9wIH6p9%2BRjEB2ALqScVyzrufVw%2BGoWI%3D"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch verified updated ARUNOMATIC v0.1.6 test build
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$ARTIFACT_URL" -o /tmp/arunomatic-v0162.zip
          mkdir -p /tmp/arunomatic-v0162
          unzip -q /tmp/arunomatic-v0162.zip -d /tmp/arunomatic-v0162
          APK="$(find /tmp/arunomatic-v0162 -type f -name 'app-debug.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" /tmp/ARUNOMATIC_SUB_v0.1.6_handoff_test.apk
          test "$(sha256sum /tmp/ARUNOMATIC_SUB_v0.1.6_handoff_test.apk | cut -d ' ' -f 1)" = "$EXPECTED_SHA256"

      - name: Test download Worker
        working-directory: download-worker
        run: npm test

      - name: Upload updated v0.1.6 test to private R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp /tmp/ARUNOMATIC_SUB_v0.1.6_handoff_test.apk             "s3://${R2_BUCKET_NAME}/releases/arunomatic/v0.1.6-test2/ARUNOMATIC_SUB_v0.1.6_handoff_test.apk"             --endpoint-url "$ENDPOINT" --region auto             --content-type application/vnd.android.package-archive             --cache-control "public,max-age=31536000,immutable"             --metadata "sha256=${EXPECTED_SHA256}" --no-progress --only-show-errors
          aws s3 cp /tmp/ARUNOMATIC_SUB_v0.1.6_handoff_test.apk             "s3://${R2_BUCKET_NAME}/apk/arunomatic-v016-test.apk"             --endpoint-url "$ENDPOINT" --region auto             --content-type application/vnd.android.package-archive             --cache-control "public,max-age=60,must-revalidate"             --metadata "sha256=${EXPECTED_SHA256}" --no-progress --only-show-errors

      - name: Deploy updated dual-version page
        working-directory: download-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.40.0 deploy

      - name: Verify updated v0.1.6 test
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location https://download.aruno-id.com/arunomatic > /tmp/page.html &&                curl --fail --silent --show-error --location --output /tmp/test.apk https://download.aruno-id.com/apk/arunomatic-v016-test.apk; then
              break
            fi
            sleep 5
          done
          grep -q 'v0.1.5 安定版' /tmp/page.html
          grep -q 'v0.1.6 引き継ぎテスト版（2秒待機版）' /tmp/page.html
          test "$(sha256sum /tmp/test.apk | cut -d ' ' -f 1)" = "$EXPECTED_SHA256"
