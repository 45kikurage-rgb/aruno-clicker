name: DPC R2 read-only access preflight
on:
  push:
    branches: ['audit/dpc-r2-access-20261017']
    paths: ['.github/workflows/dpc-r2-readonly-preflight.yml']
permissions: {}
concurrency:
  group: dpc-r2-readonly-preflight
  cancel-in-progress: false
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check existing Cloudflare credential without exposing data
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: python
        run: |
          import os, json, urllib.request, urllib.error, sys
          token = os.environ.get("CF_TOKEN", "")
          account = os.environ.get("CF_ACCOUNT", "")
          def record(result):
              line = json.dumps(result, sort_keys=True)
              print(line)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write(line + "\n")
          if not token or not account:
              record({"result":"CONFIG_MISSING","token_present":bool(token),"account_present":bool(account)})
              sys.exit(1)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          url = "https://api.cloudflare.com/client/v4/accounts/" + urllib.parse.quote(account, safe="") + "/r2/buckets"
          req = urllib.request.Request(url, headers={"Authorization":"Bearer " + token}, method="GET")
          try:
              with urllib.request.build_opener(NoRedirect).open(req, timeout=30) as response:
                  data = json.load(response)
                  ok = data.get("success") is True and isinstance(data.get("result", {}).get("buckets"), list)
                  record({"result":"R2_LIST_ALLOWED" if ok else "R2_API_REJECTED","http_status":response.status,"write_access":"NOT_TESTED","keys_created":False})
                  sys.exit(0 if ok else 1)
          except urllib.error.HTTPError as e:
              record({"result":"R2_LIST_DENIED","http_status":e.code,"keys_created":False})
              sys.exit(1)
          except Exception:
              record({"result":"R2_CONNECTION_FAILED","keys_created":False})
              sys.exit(1)
