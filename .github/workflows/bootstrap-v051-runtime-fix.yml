name: Apply ARUNO CLICKER v0.5.1 runtime fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply runtime fix
        env:
          PATCH_B64: |
            
            
            
            
            
            
            
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | tr -d '[:space:]' | base64 -d | gzip -d > /tmp/aruno-v051.patch
          git apply --check /tmp/aruno-v051.patch
          git apply /tmp/aruno-v051.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app/app/build.gradle.kts android-app/app/src/main/java/jp/aruno/clicker/automation/ArunoAccessibilityService.kt android-app/app/src/main/java/jp/aruno/clicker/automation/InterruptionClassifier.kt android-app/app/src/main/java/jp/aruno/clicker/automation/PopupCloseClassifier.kt android-app/app/src/test/java/jp/aruno/clicker/automation/InterruptionClassifierTest.kt
          git commit -m "Harden ver.S runtime interruption handling"
          git push origin HEAD:main
