name: Publish ARUNOMATIC page-plan sync test temporary

on:
  push:
    branches:
      - update/arunomatic-v016-test4
    paths:
      - ".github/workflows/publish-arunomatic-v016-test4-temp.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA256: a4485cb13c0f7774ff6e9ca484b73ce9e06ff8c3319765a80addfeafc7efb9ae
      ARTIFACT_URL: "https://sdmntprwestus.oaiusercontent.com/files/00000000-d308-8230-a3f4-353936addd51/raw?se=2026-09-28T07%3A13%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=1fe26b83-77b1-5355-80cb-eb935574aad5&skoid=18c14e53-ea0c-429b-8d09-d22d66ca7169&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T01%3A50%3A08Z&ske=2026-09-29T01%3A50%3A08Z&sks=b&skv=2026-02-06&sig=6elfJZQ2XQkehk5Il0cjUf%2BHlqhwSZX%2BTg/GpKQyWsc%3D"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch verified ARUNOMATIC page-plan sync build
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$ARTIFACT_URL" -o /tmp/arunomatic-v0164.zip
          mkdir -p /tmp/arunomatic-v0164
          unzip -q /tmp/arunomatic-v0164.zip -d /tmp/arunomatic-v0164
          APK="$(find /tmp/arunomatic-v0164 -type f -name 'app-debug.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" /tmp/ARUNOMATIC_SUB_v0.1.6_handoff_test.apk
          test "$(sha256sum /tmp/ARUNOMATIC_SUB_v0.1.6_handoff_test.apk | cut -d ' ' -f 1)" = "$EXPECTED_SHA256"

      - name: Test download Worker
        working-directory: download-worker
        run: npm test

      - name: Upload page-plan sync test to private R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp /tmp/ARUNOMATIC_SUB_v0.1.6_handoff_test.apk             "s3://${R2_BUCKET_NAME}/releases/arunomatic/v0.1.6-test4/ARUNOMATIC_SUB_v0.1.6_handoff_test.apk"             --endpoint-url "$ENDPOINT" --region auto             --content-type application/vnd.android.package-archive             --cache-control "public,max-age=31536000,immutable"             --metadata "sha256=${EXPECTED_SHA256}" --no-progress --only-show-errors
          aws s3 cp /tmp/ARUNOMATIC_SUB_v0.1.6_handoff_test.apk             "s3://${R2_BUCKET_NAME}/apk/arunomatic-v016-test.apk"             --endpoint-url "$ENDPOINT" --region auto             --content-type application/vnd.android.package-archive             --cache-control "public,max-age=60,must-revalidate"             --metadata "sha256=${EXPECTED_SHA256}" --no-progress --only-show-errors

      - name: Deploy page-plan sync download Worker
        working-directory: download-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.40.0 deploy

      - name: Verify page-plan sync test
        run: |
          set -euo pipefail
          ok=0
          for attempt in {1..15}; do
            stamp="$(date +%s)-$attempt"
            if curl --fail --silent --show-error --location "https://download.aruno-id.com/arunomatic?v=$stamp" > /tmp/page.html && curl --fail --silent --show-error --location --output /tmp/test.apk "https://download.aruno-id.com/apk/arunomatic-v016-test.apk?v=$stamp" && grep -q 'v0.1.5 安定版' /tmp/page.html && grep -q 'v0.1.6 引き継ぎテスト版（ページ構成同期）' /tmp/page.html && test "$(sha256sum /tmp/test.apk | cut -d ' ' -f 1)" = "$EXPECTED_SHA256"; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
