name: Preserve verified Aru-Tiker APK in existing private R2
on:
  push:
    branches: [feature/tiker-url-runner-code17]
    paths: [requests/tiker-stage.json]
permissions:
  contents: read
  actions: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - id: request
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const request=JSON.parse(fs.readFileSync('requests/tiker-stage.json'));
          const response=await fetch(`https://api.github.com/repos/45kikurage-rgb/aruno-clicker/actions/runs/${request.verifyRun}`,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});
          assert(response.ok);const run=await response.json();
          assert.equal(run.conclusion,'success');assert.equal(run.head_sha,request.sourceCommit);assert.equal(run.path,'.github/workflows/tiker-verify.yml');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`run=${request.verifyRun}\n`);
          JS
      - uses: actions/download-artifact@v4
        with:
          name: tiker-code17-result
          run-id: ${{ steps.request.outputs.run }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify immutable candidate and prepare its key
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib
          request=json.load(open('requests/tiker-stage.json'));facts=json.load(open('candidate/dist/release-facts.json'))
          apk=pathlib.Path('candidate/dist/Aru-Tiker-v0.6.0-code17.apk')
          assert facts['commit']==request['sourceCommit']
          assert facts['sha256']==hashlib.sha256(apk.read_bytes()).hexdigest()==request['apkSha256']
          assert facts['versionCode']==17 and facts['package']=='jp.aruno.clicker'
          assert facts['certificateSha256']=='14e1d564276b56dfbc95888ce8108aafbdaf4da938f7d5b1ed0fb593f274ca3f'
          assert facts['androidTests']['failures']==facts['androidTests']['errors']==facts['androidTests']['skipped']==0
          pathlib.Path('candidate/key.txt').write_text('releases/tiker/0.6.0-code17/'+facts['sha256']+'/Aru-Tiker-v0.6.0-code17.apk')
          PY
      - name: Stage only the versioned APK, preserve all public aliases
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ACCOUNT_ID" = 02100d2235d6f7d7f893b4217b58b902
          test "$R2_BUCKET_NAME" = aruno-clicker-download
          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          key="$(cat candidate/key.txt)"
          digest="$(sha256sum candidate/dist/Aru-Tiker-v0.6.0-code17.apk | cut -d ' ' -f1)"
          aws s3 cp candidate/dist/Aru-Tiker-v0.6.0-code17.apk "s3://${R2_BUCKET_NAME}/${key}" --endpoint-url "$endpoint" --content-type application/vnd.android.package-archive --cache-control public,max-age=31536000,immutable --metadata "sha256=${digest},filename=Aru-Tiker-v0.6.0-code17.apk" --no-progress --only-show-errors
          aws s3 cp "s3://${R2_BUCKET_NAME}/${key}" candidate/readback.apk --endpoint-url "$endpoint" --no-progress --only-show-errors
          test "$(sha256sum candidate/readback.apk | cut -d ' ' -f1)" = "$digest"
          python3 - <<'PY'
          import json,pathlib,os
          facts=json.load(open('candidate/dist/release-facts.json'))
          proof={'sha256':facts['sha256'],'bytes':facts['bytes'],'sourceCommit':facts['commit'],'privateR2ReadbackVerified':True,'key':pathlib.Path('candidate/key.txt').read_text(),'stageRun':os.environ['GITHUB_RUN_ID'],'published':False}
          pathlib.Path('candidate/private-stage.json').write_text(json.dumps(proof,indent=2))
          print(json.dumps(proof))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tiker-code17-private-stage
          path: |
            candidate/private-stage.json
            candidate/dist/release-facts.json
          retention-days: 30
