name: Publish ARUNOMATIC test9a final APK

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-arunomatic-test9a-final.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      EXPECTED_TEST_SHA256: 1479582175d14833cc4f71d4d0c90ad3a73eea6f7558d371e8e6add5d6e01081
      TEST_ARTIFACT_ZIP_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-3fe4-8206-9116-2dcb865a1abd/raw?se=2026-09-28T11%3A48%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=ba2f2776-8040-5bff-9e98-c5f93c05b97b&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T00%3A12%3A57Z&ske=2026-09-29T00%3A12%3A57Z&sks=b&skv=2026-02-06&sig=Z4aPDFdEa9r0mXhguKnmfGaGMdSmTT5xtqcvztzrMfk%3D"
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified test9a APK to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$R2_BUCKET_NAME"
          curl --fail --silent --show-error --location "$TEST_ARTIFACT_ZIP_URL" -o /tmp/arunomatic-test9a.zip
          rm -rf /tmp/arunomatic-test9a
          mkdir -p /tmp/arunomatic-test9a
          unzip -q /tmp/arunomatic-test9a.zip -d /tmp/arunomatic-test9a
          APK="$(find /tmp/arunomatic-test9a -type f -name 'app-debug.apk' -print -quit)"
          test -n "$APK"
          test "$(sha256sum "$APK" | cut -d ' ' -f 1)" = "$EXPECTED_TEST_SHA256"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "$APK" \
            "s3://${R2_BUCKET_NAME}/releases/arunomatic/v0.1.6-handoff-test9a-final/ARUNOMATIC_SUB_v0.1.6-handoff-test9a-final.apk" \
            --endpoint-url "$ENDPOINT" --region auto \
            --content-type application/vnd.android.package-archive \
            --cache-control "public,max-age=31536000,immutable" \
            --metadata "sha256=${EXPECTED_TEST_SHA256}" --no-progress --only-show-errors
          aws s3 cp "$APK" \
            "s3://${R2_BUCKET_NAME}/apk/arunomatic-v016-test.apk" \
            --endpoint-url "$ENDPOINT" --region auto \
            --content-type application/vnd.android.package-archive \
            --cache-control "no-store" \
            --metadata "sha256=${EXPECTED_TEST_SHA256}" --no-progress --only-show-errors
