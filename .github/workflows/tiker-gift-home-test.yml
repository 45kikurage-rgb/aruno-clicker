name: Aru-Tiker gift home navigation tests
on:
  push:
    branches: [feat/tiker-gift-home-route-20261029]
    paths: [requests/tiker-gift-home-test.json]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test normal edition and compile unsigned candidate
        working-directory: android-app
        run: gradle --no-daemon --console=plain testAtlasDebugUnitTest assembleAtlasRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiker-code26-unsigned-tests
          path: |
            android-app/app/build/outputs/apk/atlas/release/
            android-app/app/build/test-results/
            android-app/app/build/reports/tests/
          retention-days: 30
